<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MIT Course Cards</title>
  <link rel="stylesheet" href="style-cards.css">
  <script src="script-cards.js" defer></script>
</head>
<body>
  <section class="courses">
    <article class="card bca" tabindex="0" data-course="BCA">
      <h3>BCA</h3>
      <p>Computer Applications and programming fundamentals.</p>
      <button class="countBtn">Clicked 0</button>
    </article>
    <article class="card csit" tabindex="0" data-course="CSIT">
      <h3>CSIT</h3>
      <p>Computer Science and Information Technology concepts.</p>
      <button class="countBtn">Clicked 0</button>
    </article>
    <article class="card bit" tabindex="0" data-course="BIT">
      <h3>BIT</h3>
      <p>Business and Information Technology integration.</p>
      <button class="countBtn">Clicked 0</button>
    </article>
  </section>
  <p id="totalClicks">Total: 0</p>
</body>
</html>
